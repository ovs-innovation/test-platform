server {
    listen 80 default_server;
    server_name edvedum.com www.edvedum.com cbt.prosperrainfra.com localhost _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name edvedum.com www.edvedum.com cbt.prosperrainfra.com localhost _;

    ssl_certificate /etc/letsencrypt/live/cbt.prosperrainfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.prosperrainfra.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 50MB (solution PDFs & media)
    client_max_body_size 50M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API requests to the backend service inside the Docker network.
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets cache control
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA index.html cache control
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Normalize trailing slash for frontend routes (e.g. /test-series/ -> /test-series)
    location ~ ^(.+)/+$ {
        return 301 $scheme://$host$1$is_args$args;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri /index.html;
    }
}
