server {
    listen 80;
    server_name cbt.prosperrainfra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cbt.prosperrainfra.com;

    ssl_certificate /etc/letsencrypt/live/cbt.prosperrainfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.prosperrainfra.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 50MB (solution PDFs & media)
    client_max_body_size 50M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy API requests to the backend service inside the Docker network.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback — all other routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
