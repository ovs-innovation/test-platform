<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield / Circle Base -->
  <circle cx="120" cy="120" r="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Target Aim Rings (Drona Focus) -->
  <circle cx="120" cy="98" r="44" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" />
  <circle cx="120" cy="98" r="28" fill="none" stroke="#eab308" stroke-width="1.2" opacity="0.4" />
  <circle cx="120" cy="98" r="12" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.7" />

  <!-- Drona Golden Bow & Arrow Emblem -->
  <!-- Bow Arc -->
  <path d="M 86,128 C 76,98 88,68 120,54 C 152,68 164,98 154,128" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Bow String -->
  <line x1="86" y1="128" x2="120" y2="114" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
  <line x1="154" y1="128" x2="120" y2="114" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
  <!-- Arrow Shaft -->
  <line x1="120" y1="130" x2="120" y2="40" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Arrow Head -->
  <polygon points="120,32 113,48 120,44 127,48" fill="url(#goldGrad)" />
  <!-- Arrow Fletching -->
  <path d="M 115,124 L 120,118 L 125,124 M 115,130 L 120,124 L 125,130" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Academy Laurel Sprigs (Left & Right) -->
  <!-- Left Laurel -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <path d="M 64,106 C 60,102 54,106 58,112 C 62,116 68,112 64,106 Z" />
    <path d="M 58,122 C 54,118 48,122 52,128 C 56,132 62,128 58,122 Z" />
    <path d="M 58,138 C 54,136 50,142 54,147 C 58,150 63,144 58,138 Z" />
    <path d="M 66,152 C 62,150 60,158 64,162 C 69,165 73,158 66,152 Z" />
  </g>
  <!-- Right Laurel -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <path d="M 176,106 C 180,102 186,106 182,112 C 178,116 172,112 176,106 Z" />
    <path d="M 182,122 C 186,118 192,122 188,128 C 184,132 178,128 182,122 Z" />
    <path d="M 182,138 C 186,136 190,142 186,147 C 182,150 177,144 182,138 Z" />
    <path d="M 174,152 C 178,150 180,158 176,162 C 171,165 167,158 174,152 Z" />
  </g>

  <!-- Laurel Stem Ribbons -->
  <path d="M 55,102 C 45,135 60,165 80,175" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.7" />
  <path d="M 185,102 C 195,135 180,165 160,175" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.7" />

  <!-- Central Star of Excellence -->
  <polygon points="120,86 122.5,93 130,93 124,98 126,105 120,101 114,105 116,98 110,93 117.5,93" fill="#ffffff" filter="url(#shadow)" />

  <!-- Banner Ribbon for "DRONA" -->
  <rect x="42" y="166" width="156" height="30" rx="6" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)" />

  <text x="120" y="186" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="url(#goldGrad)">
    DRONA ACADEMY
  </text>

  <!-- Subtitle Tagline -->
  <text x="120" y="212" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="9.5" letter-spacing="2" fill="#38bdf8">
    NEET · KOTA PREMIER
  </text>
</svg>
