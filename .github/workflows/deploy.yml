name: Production Deployment (EDVEDUM)

on:
  push:
    branches:
      - main

# Prevent concurrent deployment race conditions on the VPS
concurrency:
  group: production-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 15m
          command_timeout: 15m
          script: |
            set -euo pipefail

            PROJECT_DIR="/var/www/test-platform"
            BACKUP_DIR="/tmp/edvedum_prod_backup_$(date +%s)"
            INTERNAL_HEALTH_URL="http://localhost:5000/api/health"
            INTERNAL_READY_URL="http://localhost:5000/api/health/ready"
            PUBLIC_HEALTH_URL="https://edvedum.com/api/health"
            PUBLIC_READY_URL="https://edvedum.com/api/health/ready"
            MAX_RETRIES=24
            RETRY_INTERVAL=5

            log() {
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $1"
            }

            log "=================================================="
            log " EDVEDUM Production Safe CI/CD Deployment"
            log " Target Domain: edvedum.com"
            log " Target Host: /var/www/test-platform"
            log "=================================================="

            if [ ! -d "$PROJECT_DIR" ]; then
              log "CRITICAL ERROR: Deployment directory $PROJECT_DIR does not exist on VPS!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            # 1. Clear any stuck git state (rebase/merge conflicts)
            log "Step 1/8: Clearing any pending git merge or rebase operations..."
            git merge --abort || true
            git rebase --abort || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            log "Currently active VPS commit: ${PREV_COMMIT:-'Initial Deployment'}"

            # 2. Backup production-specific files before git reset
            log "Step 2/8: Backing up production-specific files to /tmp..."
            mkdir -p "$BACKUP_DIR"

            if [ -f "backend/src/config/db.js" ]; then
              mkdir -p "$BACKUP_DIR/backend/src/config"
              cp "backend/src/config/db.js" "$BACKUP_DIR/backend/src/config/db.js"
              log "Backed up backend/src/config/db.js"
            fi

            if [ -f "frontend/nginx.conf" ]; then
              mkdir -p "$BACKUP_DIR/frontend"
              cp "frontend/nginx.conf" "$BACKUP_DIR/frontend/nginx.conf"
              log "Backed up frontend/nginx.conf"
            fi

            # 3. Clean fetch and hard reset to origin/main
            log "Step 3/8: Fetching latest code and resetting repository..."
            git fetch origin main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)
            log "New target commit: ${NEW_COMMIT}"

            # 4. Restore production files from backup
            log "Step 4/8: Restoring production-specific files..."
            if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
              cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js"
              log "Restored backend/src/config/db.js"
            fi

            if [ -f "$BACKUP_DIR/frontend/nginx.conf" ]; then
              cp "$BACKUP_DIR/frontend/nginx.conf" "frontend/nginx.conf"
              log "Restored frontend/nginx.conf"
            fi

            # Function to execute rollback on failure
            execute_rollback() {
              log "CRITICAL FAILURE OCCURRED! Diagnostics:"
              log "--- Container Status ---"
              docker compose ps || true
              log "--- Backend Container Logs (Last 100 Lines) ---"
              docker compose logs --tail=100 backend || true

              if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
                log "Initiating automatic rollback to commit ${PREV_COMMIT}..."
                git checkout "$PREV_COMMIT" || true
                
                if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
                  cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js" || true
                fi
                if [ -f "$BACKUP_DIR/frontend/nginx.conf" ]; then
                  cp "$BACKUP_DIR/frontend/nginx.conf" "frontend/nginx.conf" || true
                fi

                docker compose build
                docker compose up -d --remove-orphans
                log "Rollback executed to commit ${PREV_COMMIT}."
              fi

              rm -rf "$BACKUP_DIR" || true
              exit 1
            }

            # 5. Build and start containers
            log "Step 5/8: Building Docker images..."
            docker compose build

            log "Step 6/8: Starting production containers in background..."
            docker compose up -d --remove-orphans

            log "Waiting 5 seconds for backend process initialization..."
            sleep 5

            # 6. Internal localhost Health Verification
            log "Step 7/8: Verifying internal health via localhost:5000..."

            INT_HEALTH_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$INTERNAL_HEALTH_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Internal liveness check PASSED (HTTP 200) on attempt ${i}/${MAX_RETRIES}!"
                INT_HEALTH_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Internal liveness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$INT_HEALTH_OK" = "false" ]; then
              log "Internal liveness check failed!"
              execute_rollback
            fi

            INT_READY_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$INTERNAL_READY_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Internal readiness check PASSED (HTTP 200 - DB Connected) on attempt ${i}/${MAX_RETRIES}!"
                INT_READY_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Internal readiness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$INT_READY_OK" = "false" ]; then
              log "Internal readiness check failed!"
              execute_rollback
            fi

            # 7. Public HTTPS Health Verification
            log "Step 8/8: Verifying public health via https://edvedum.com..."

            PUB_HEALTH_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$PUBLIC_HEALTH_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Public liveness check PASSED (HTTP 200) on attempt ${i}/${MAX_RETRIES}!"
                PUB_HEALTH_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Public liveness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$PUB_HEALTH_OK" = "false" ]; then
              log "Public liveness check failed!"
              execute_rollback
            fi

            PUB_READY_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$PUBLIC_READY_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Public readiness check PASSED (HTTP 200 - DB Connected) on attempt ${i}/${MAX_RETRIES}!"
                PUB_READY_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Public readiness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$PUB_READY_OK" = "false" ]; then
              log "Public readiness check failed!"
              execute_rollback
            fi

            # Clean up dangling image layers & backup dir
            log "Pruning dangling Docker build cache layers..."
            docker image prune -f --filter "until=24h" || true
            rm -rf "$BACKUP_DIR" || true

            log "=================================================="
            log " EDVEDUM Production Deployment SUCCESSFUL!"
            log " Active Commit: ${NEW_COMMIT}"
            log " Status: 100% Operational (Internal & Public Health OK)"
            log "=================================================="
