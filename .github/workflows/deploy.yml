name: Production Deployment (EDVEDUM)

on:
  push:
    branches:
      - main

# Prevent concurrent deployment race conditions on the VPS
concurrency:
  group: production-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 15m
          command_timeout: 15m
          script: |
            set -euo pipefail

            PROJECT_DIR="/var/www/test-platform"
            HEALTH_URL="https://edvedum.com/api/health"
            READY_URL="https://edvedum.com/api/health/ready"
            MAX_RETRIES=24
            RETRY_INTERVAL=5
            STASH_CREATED=false

            log() {
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $1"
            }

            log "=================================================="
            log " EDVEDUM Production Enterprise CI/CD Deployment"
            log " Target Domain: edvedum.com"
            log " Target Host: /var/www/test-platform"
            log "=================================================="

            if [ ! -d "$PROJECT_DIR" ]; then
              log "CRITICAL ERROR: Deployment directory $PROJECT_DIR does not exist on VPS!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            log "Currently active VPS commit: ${PREV_COMMIT:-'Initial Deployment'}"

            # Step 1: Safe Git Syncing - Protect Local Uncommitted Production Overrides
            log "Step 1/6: Syncing latest source code from GitHub..."
            
            if [ -n "$(git status --porcelain)" ]; then
              log "NOTICE: Local VPS uncommitted changes detected. Safely stashing local production overrides..."
              git stash push -m "ci-autostash-$(date +%s)"
              STASH_CREATED=true
            fi

            git fetch origin main
            git checkout main
            git pull --rebase origin main

            NEW_COMMIT=$(git rev-parse HEAD)
            log "New target commit fetched: ${NEW_COMMIT}"

            # Re-apply local stashed overrides if stashed previously
            if [ "$STASH_CREATED" = "true" ]; then
              log "Re-applying stashed local production overrides..."
              git stash pop || log "WARNING: Local stash re-apply required manual verification."
            fi

            # Step 2: Build Production Docker Images
            log "Step 2/6: Building production Docker images..."
            docker compose build

            # Step 3: Zero-Downtime Container Transition (Preserving all volumes & .env)
            log "Step 3/6: Deploying updated containers (Preserving PostgreSQL & upload volumes)..."
            docker compose up -d --remove-orphans

            log "Waiting 5 seconds for backend process stabilization..."
            sleep 5

            # Step 4: Liveness Health Check (Process & HTTP Server)
            log "Step 4/6: Verifying process liveness (${HEALTH_URL})..."
            HEALTH_SUCCESS=false

            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "SUCCESS: Liveness check PASSED (HTTP 200 OK) on attempt ${i}/${MAX_RETRIES}!"
                HEALTH_SUCCESS=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Liveness check returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$HEALTH_SUCCESS" = "false" ]; then
              log "CRITICAL FAILURE: Liveness health check failed after ${MAX_RETRIES} attempts!"
              log "Dumping backend container log tail (last 100 lines):"
              docker compose logs --tail=100 backend || true

              if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
                log "ATTENTION: Executing automatic rollback to commit ${PREV_COMMIT}..."
                git checkout "$PREV_COMMIT"
                docker compose build
                docker compose up -d --remove-orphans
                log "Rollback completed. Containers restored to previous commit ${PREV_COMMIT}."
              fi
              exit 1
            fi

            # Step 5: Database Readiness Health Check (Query execution & DB Pool)
            log "Step 5/6: Verifying database readiness (${READY_URL})..."
            READY_SUCCESS=false

            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$READY_URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "SUCCESS: Database readiness check PASSED (HTTP 200 OK - DB Connected) on attempt ${i}/${MAX_RETRIES}!"
                READY_SUCCESS=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Database readiness check returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$READY_SUCCESS" = "false" ]; then
              log "CRITICAL FAILURE: Database readiness check failed after ${MAX_RETRIES} attempts!"
              log "Dumping backend container log tail (last 100 lines):"
              docker compose logs --tail=100 backend || true

              if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
                log "ATTENTION: Executing automatic rollback to commit ${PREV_COMMIT}..."
                git checkout "$PREV_COMMIT"
                docker compose build
                docker compose up -d --remove-orphans
                log "Rollback completed. Containers restored to previous commit ${PREV_COMMIT}."
              fi
              exit 1
            fi

            # Step 6: Post-Deployment Cleanup & Verification
            log "Step 6/6: Pruning unused dangling Docker image layers to prevent VPS disk bloat..."
            docker image prune -f --filter "until=24h" || true

            log "Final Production Container Summary:"
            docker compose ps

            log "=================================================="
            log " EDVEDUM Production Deployment SUCCESSFUL!"
            log " Active Commit: ${NEW_COMMIT}"
            log " Health Status: Fully Operational (200 OK)"
            log "=================================================="
