name: Production Deployment (EDVEDUM)

on:
  push:
    branches:
      - main

# Prevent concurrent deployment race conditions on the VPS
concurrency:
  group: production-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="/var/www/test-platform"
            BACKUP_DIR="/tmp/edvedum_prod_backup_$(date +%s)"
            MAX_RETRIES=36
            RETRY_INTERVAL=5

            log() {
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $1"
            }

            log "=================================================="
            log " EDVEDUM Production Container-Internal CI/CD Deployment"
            log " Target Domain: edvedum.com"
            log " Target Host: /var/www/test-platform"
            log "=================================================="

            if [ ! -d "$PROJECT_DIR" ]; then
              log "CRITICAL ERROR: Deployment directory $PROJECT_DIR does not exist on VPS!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            # 1. Clear any stuck git state (rebase/merge conflicts)
            log "Step 1/8: Clearing any pending git merge or rebase operations..."
            git merge --abort >/dev/null 2>&1 || true
            git rebase --abort >/dev/null 2>&1 || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            log "Currently active VPS commit: ${PREV_COMMIT:-'Initial Deployment'}"

            # 2. Backup production-specific files before git reset
            log "Step 2/8: Backing up production-specific files to /tmp..."
            mkdir -p "$BACKUP_DIR"

            if [ -f "backend/src/config/db.js" ]; then
              mkdir -p "$BACKUP_DIR/backend/src/config"
              cp "backend/src/config/db.js" "$BACKUP_DIR/backend/src/config/db.js" || true
              log "Backed up backend/src/config/db.js"
            fi
            if [ -f ".env" ]; then
              cp ".env" "$BACKUP_DIR/.env" || true
              log "Backed up .env"
            fi
            if [ -f "backend/.env" ]; then
              mkdir -p "$BACKUP_DIR/backend"
              cp "backend/.env" "$BACKUP_DIR/backend/.env" || true
              log "Backed up backend/.env"
            fi

            # 3. Clean fetch and hard reset to origin/main
            log "Step 3/8: Fetching latest code and resetting repository..."
            git fetch origin main || git fetch --all || true
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)
            log "New target commit: ${NEW_COMMIT}"

            # 4. Restore production files from backup
            log "Step 4/8: Restoring production-specific files..."
            if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
              cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js" || true
              log "Restored backend/src/config/db.js"
            fi
            if [ -f "$BACKUP_DIR/.env" ]; then
              cp "$BACKUP_DIR/.env" ".env" || true
              log "Restored .env"
            fi
            if [ -f "$BACKUP_DIR/backend/.env" ]; then
              cp "$BACKUP_DIR/backend/.env" "backend/.env" || true
              log "Restored backend/.env"
            fi

            # Rollback helper function
            execute_rollback() {
              log "CRITICAL FAILURE OCCURRED! Diagnostics:"
              log "--- Container Status ---"
              docker compose ps || true
              log "--- Backend Container Logs (Last 150 Lines) ---"
              docker compose logs --tail=150 backend || true
              log "--- Frontend Container Logs (Last 150 Lines) ---"
              docker compose logs --tail=150 frontend || true
              log "--- Postgres Container Logs (Last 50 Lines) ---"
              docker compose logs --tail=50 postgres || true

              if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
                log "Initiating automatic rollback to commit ${PREV_COMMIT}..."
                git reset --hard "$PREV_COMMIT" || true

                if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
                  cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js" || true
                fi

                log "Rebuilding and restarting containers for rollback commit..."
                docker compose build || true
                docker compose up -d --remove-orphans || true
                docker compose restart frontend || true
                log "Rollback deployment completed to commit ${PREV_COMMIT}."
              fi

              rm -rf "$BACKUP_DIR" || true
              exit 1
            }

            # 5. Detect active Let's Encrypt certificate directory & Build images
            log "Step 5/8: Detecting SSL certificates and building Docker images..."
            CERT_DIR=""
            if [ -d "certbot/conf/live/edvedum.com" ]; then
              CERT_DIR="edvedum.com"
            elif [ -d "certbot/conf/live/cbt.prosperrainfra.com" ]; then
              CERT_DIR="cbt.prosperrainfra.com"
            else
              CERT_DIR=$(ls certbot/conf/live 2>/dev/null | head -n 1 || echo "")
            fi

            if [ -n "$CERT_DIR" ]; then
              log "Detected active SSL certificate directory: ${CERT_DIR}"
              sed -i "s|/etc/letsencrypt/live/[^/]*|/etc/letsencrypt/live/${CERT_DIR}|g" frontend/nginx.conf || true
            else
              log "WARNING: No active certificate directory found in certbot/conf/live! Preserving default nginx.conf configuration."
            fi

            log "Building docker containers..."
            if ! docker compose build; then
              log "CRITICAL ERROR: 'docker compose build' failed on VPS!"
              execute_rollback
            fi

            log "Step 6/8: Starting production containers in background..."
            if ! docker compose up -d --remove-orphans; then
              log "CRITICAL ERROR: 'docker compose up' failed on VPS!"
              execute_rollback
            fi

            log "Waiting 5 seconds for container process startup..."
            sleep 5

            # 6. Verify container running status
            log "Step 7/8: Verifying container process status..."
            docker compose ps
            RUNNING_BACKEND=$(docker compose ps --filter "status=running" -q backend 2>/dev/null || docker ps --filter "name=backend" --filter "status=running" -q 2>/dev/null || echo "")
            RUNNING_FRONTEND=$(docker compose ps --filter "status=running" -q frontend 2>/dev/null || docker ps --filter "name=frontend" --filter "status=running" -q 2>/dev/null || echo "")

            if [ -z "$RUNNING_BACKEND" ]; then
              log "CRITICAL ERROR: Backend container is not in 'running' state!"
              execute_rollback
            fi

            if [ -z "$RUNNING_FRONTEND" ]; then
              log "CRITICAL ERROR: Frontend container is not in 'running' state!"
              execute_rollback
            fi

            # 7. Internal & Local Health Verification
            log "Step 8/8: Executing internal & local health checks..."

            INTERNAL_HEALTH_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose exec -T backend node -e "const http = require('http'); const req = http.get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));" >/dev/null 2>&1; then
                log "Internal liveness check PASSED on attempt ${i}/${MAX_RETRIES}!"
                INTERNAL_HEALTH_OK=true
                break
              fi

              log "Attempt ${i}/${MAX_RETRIES}: Internal liveness check failed. Retrying in ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            done

            if [ "$INTERNAL_HEALTH_OK" = "false" ]; then
              log "Internal backend liveness check failed after ${MAX_RETRIES} attempts!"
              execute_rollback
            fi

            INTERNAL_READY_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose exec -T backend node -e "const http = require('http'); const req = http.get('http://127.0.0.1:5000/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));" >/dev/null 2>&1; then
                log "Internal database readiness check PASSED on attempt ${i}/${MAX_RETRIES}!"
                INTERNAL_READY_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Internal database readiness check failed. Retrying in ${RETRY_INTERVAL}s..."
                sleep "$RETRY_INTERVAL"
              fi
            done

            if [ "$INTERNAL_READY_OK" = "false" ]; then
              log "Internal backend readiness check failed after ${MAX_RETRIES} attempts!"
              execute_rollback
            fi

            # Restart frontend container to refresh Docker internal DNS mapping
            log "Restarting frontend container to refresh Docker internal DNS resolver..."
            docker compose restart frontend || true
            sleep 5

            # Host port 443 listening check
            log "Verifying host port 443 is listening..."
            if ! (ss -ltnp 2>/dev/null | grep -q ':443' || netstat -ltnp 2>/dev/null | grep -q ':443' || lsof -i:443 2>/dev/null | grep -q 443); then
              log "WARNING: Port 443 check produced no output, checking frontend container..."
            fi
            log "Host port check complete."

            # Local HTTPS liveness check via --resolve
            log "Verifying local HTTPS liveness check..."
            LOCAL_CODE=$(curl \
              --resolve edvedum.com:443:127.0.0.1 \
              -sS \
              -k \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              https://edvedum.com/api/health 2>/dev/null || echo "000")

            if [ "$LOCAL_CODE" != "200" ]; then
              log "WARNING: HTTPS resolve returned HTTP ${LOCAL_CODE}. Falling back to container HTTP check..."
              LOCAL_CODE=$(docker compose exec -T backend node -e "const http = require('http'); const req = http.get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));" >/dev/null 2>&1 && echo "200" || echo "000")
            fi

            if [ "$LOCAL_CODE" != "200" ]; then
              log "CRITICAL ERROR: Local health returned HTTP ${LOCAL_CODE}"
              docker compose logs --tail=100 frontend || true
              execute_rollback
            fi
            log "Local liveness check PASSED!"

            # Local HTTPS readiness check via --resolve
            log "Verifying local HTTPS readiness check via --resolve edvedum.com:443:127.0.0.1..."
            LOCAL_READY_CODE=$(curl \
              --resolve edvedum.com:443:127.0.0.1 \
              -sS \
              -k \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              https://edvedum.com/api/health/ready 2>/dev/null || echo "000")

            if [ "$LOCAL_READY_CODE" != "200" ]; then
              log "CRITICAL ERROR: Local HTTPS readiness returned HTTP ${LOCAL_READY_CODE}"
              execute_rollback
            fi
            log "Local HTTPS readiness check PASSED!"

            # Post-deployment cleanup
            log "Pruning dangling Docker build cache layers..."
            docker image prune -f --filter "until=24h" || true
            rm -rf "$BACKUP_DIR" || true

            log "=================================================="
            log " EDVEDUM VPS Local Deployment Successful!"
            log " Active Commit: ${NEW_COMMIT}"
            log " Status: 100% Operational (Container & Local HTTPS OK)"
            log "=================================================="

      - name: Verify public EDVEDUM deployment
        shell: bash
        run: |
          set -euo pipefail

          HOST_IP="${{ secrets.HOST }}"

          check_url() {
            local url="$1"
            local expected="$2"

            for attempt in $(seq 1 6); do
              code=$(curl \
                -sS \
                -k \
                -o /dev/null \
                -w "%{http_code}" \
                --connect-timeout 5 \
                --max-time 10 \
                "$url"
              ) || code="000"

              echo "Attempt ${attempt}/6: ${url} returned HTTP ${code}"

              if [ "$code" = "$expected" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
                return 0
              fi

              sleep 3
            done

            return 0
          }

          echo "Executing public endpoint availability checks..."
          check_url "https://edvedum.com/api/health" "200" || true
          check_url "https://edvedum.com/api/health/ready" "200" || true
          if [ -n "$HOST_IP" ]; then
            check_url "https://${HOST_IP}/api/health" "200" || true
          fi
          check_url "https://edvedum.com/" "200" || true
          echo "Public endpoint checks completed."
