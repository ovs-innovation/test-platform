name: Production Deployment (EDVEDUM)

on:
  push:
    branches:
      - main

# Prevent concurrent deployment race conditions on the VPS
concurrency:
  group: production-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 15m
          command_timeout: 15m
          script: |
            set -euo pipefail

            PROJECT_DIR="/var/www/test-platform"
            BACKUP_DIR="/tmp/edvedum_prod_backup_$(date +%s)"
            PUBLIC_HEALTH_URL="https://edvedum.com/api/health"
            PUBLIC_READY_URL="https://edvedum.com/api/health/ready"
            MAX_RETRIES=24
            RETRY_INTERVAL=5

            log() {
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $1"
            }

            log "=================================================="
            log " EDVEDUM Production Container-Internal CI/CD Deployment"
            log " Target Domain: edvedum.com"
            log " Target Host: /var/www/test-platform"
            log "=================================================="

            if [ ! -d "$PROJECT_DIR" ]; then
              log "CRITICAL ERROR: Deployment directory $PROJECT_DIR does not exist on VPS!"
              exit 1
            fi

            cd "$PROJECT_DIR"

            # 1. Clear any stuck git state (rebase/merge conflicts)
            log "Step 1/9: Clearing any pending git merge or rebase operations..."
            git merge --abort || true
            git rebase --abort || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            log "Currently active VPS commit: ${PREV_COMMIT:-'Initial Deployment'}"

            # 2. Backup production-specific files before git reset
            log "Step 2/9: Backing up production-specific files to /tmp..."
            mkdir -p "$BACKUP_DIR"

            if [ -f "backend/src/config/db.js" ]; then
              mkdir -p "$BACKUP_DIR/backend/src/config"
              cp "backend/src/config/db.js" "$BACKUP_DIR/backend/src/config/db.js"
              log "Backed up backend/src/config/db.js"
            fi

            # 3. Clean fetch and hard reset to origin/main
            log "Step 3/9: Fetching latest code and resetting repository..."
            git fetch origin main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)
            log "New target commit: ${NEW_COMMIT}"

            # 4. Restore production files from backup
            log "Step 4/9: Restoring production-specific files..."
            if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
              cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js"
              log "Restored backend/src/config/db.js"
            fi

            # Rollback helper function
            execute_rollback() {
              log "CRITICAL FAILURE OCCURRED! Diagnostics:"
              log "--- Container Status ---"
              docker compose ps || true
              log "--- Backend Container Logs (Last 150 Lines) ---"
              docker compose logs --tail=150 backend || true

              if [ -n "$PREV_COMMIT" ] && [ "$PREV_COMMIT" != "$NEW_COMMIT" ]; then
                log "Initiating automatic rollback to commit ${PREV_COMMIT}..."
                git reset --hard "$PREV_COMMIT" || true

                if [ -f "$BACKUP_DIR/backend/src/config/db.js" ]; then
                  cp "$BACKUP_DIR/backend/src/config/db.js" "backend/src/config/db.js" || true
                fi

                log "Rebuilding and restarting containers for rollback commit..."
                docker compose build
                docker compose up -d --remove-orphans
                docker compose restart frontend || true
                log "Rollback deployment completed to commit ${PREV_COMMIT}."

                log "Verifying post-rollback public health status..."
                sleep 5
                ROLLBACK_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "$PUBLIC_HEALTH_URL") || ROLLBACK_CODE="000"
                if [ "$ROLLBACK_CODE" -eq 200 ]; then
                  log "POST-ROLLBACK STATUS: Service successfully restored on commit ${PREV_COMMIT} (HTTP 200 OK)."
                else
                  log "POST-ROLLBACK STATUS WARNING: Rollback completed, but public health returned HTTP ${ROLLBACK_CODE}."
                fi
              fi

              rm -rf "$BACKUP_DIR" || true
              exit 1
            }

            # 5. Detect active Let's Encrypt certificate directory & Build images
            log "Step 5/9: Detecting SSL certificates and building Docker images..."
            CERT_DIR=""
            if [ -d "certbot/conf/live" ]; then
              if [ -f "certbot/conf/live/edvedum.com/fullchain.pem" ]; then
                CERT_DIR="edvedum.com"
              elif [ -f "certbot/conf/live/cbt.prosperrainfra.com/fullchain.pem" ]; then
                CERT_DIR="cbt.prosperrainfra.com"
              else
                CERT_DIR=$(find certbot/conf/live -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/fullchain.pem" \; -print -quit 2>/dev/null | xargs -r basename || echo "")
              fi
            fi

            if [ -n "$CERT_DIR" ]; then
              log "Detected active SSL certificate directory: ${CERT_DIR}"
              sed -i "s|/etc/letsencrypt/live/[^/]*|/etc/letsencrypt/live/${CERT_DIR}|g" frontend/nginx.conf
            else
              log "WARNING: No active certificate directory found in certbot/conf/live!"
            fi

            docker compose build

            log "Step 6/9: Starting production containers in background..."
            docker compose up -d --remove-orphans

            log "Waiting 5 seconds for container process startup..."
            sleep 5

            # 6. Verify container running status
            log "Step 7/9: Verifying container process status..."
            docker compose ps
            RUNNING_BACKEND=$(docker compose ps --status running backend -q || echo "")
            RUNNING_FRONTEND=$(docker compose ps --status running frontend -q || echo "")

            if [ -z "$RUNNING_BACKEND" ]; then
              log "CRITICAL ERROR: Backend container is not in 'running' state!"
              execute_rollback
            fi

            if [ -z "$RUNNING_FRONTEND" ]; then
              log "CRITICAL ERROR: Frontend container is not in 'running' state! Container logs:"
              docker compose logs --tail=100 frontend || true
              execute_rollback
            fi

            # 7. Internal & Local Health Verification
            log "Step 8/9: Executing internal & local health checks..."

            INTERNAL_HEALTH_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose exec -T backend node -e "fetch('http://127.0.0.1:5000/api/health').then(r => { if (!r.ok) process.exit(1); return r.text(); }).then(console.log).catch(() => process.exit(1));"; then
                log "Internal liveness check PASSED on attempt ${i}/${MAX_RETRIES}!"
                INTERNAL_HEALTH_OK=true
                break
              fi

              log "Attempt ${i}/${MAX_RETRIES}: Internal liveness check failed. Retrying in ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            done

            if [ "$INTERNAL_HEALTH_OK" = "false" ]; then
              log "Internal backend liveness check failed after ${MAX_RETRIES} attempts!"
              execute_rollback
            fi

            INTERNAL_READY_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose exec -T backend node -e "fetch('http://127.0.0.1:5000/api/health/ready').then(r => { if (!r.ok) process.exit(1); return r.text(); }).then(console.log).catch(() => process.exit(1));"; then
                log "Internal database readiness check PASSED on attempt ${i}/${MAX_RETRIES}!"
                INTERNAL_READY_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Internal database readiness check failed. Retrying in ${RETRY_INTERVAL}s..."
                sleep "$RETRY_INTERVAL"
              fi
            done

            if [ "$INTERNAL_READY_OK" = "false" ]; then
              log "Internal backend readiness check failed after ${MAX_RETRIES} attempts!"
              execute_rollback
            fi

            # Restart frontend container to refresh Docker internal DNS mapping
            log "Restarting frontend container to refresh Docker internal DNS resolver..."
            docker compose restart frontend
            sleep 5

            # Local HTTP API health check
            log "Verifying local HTTP API health via http://127.0.0.1/api/health..."
            if ! curl -fL --retry 10 --retry-delay 2 -sS http://127.0.0.1/api/health > /dev/null; then
              log "CRITICAL ERROR: Local HTTP health check failed! Frontend logs:"
              docker compose logs --tail=100 frontend || true
              execute_rollback
            fi
            log "Local HTTP health check PASSED!"

            # Host port 443 listening check
            log "Verifying host port 443 is listening..."
            if ! (ss -ltnp | grep -q ':443' || netstat -ltnp 2>/dev/null | grep -q ':443'); then
              log "CRITICAL ERROR: Port 443 is not listening on host! Frontend logs:"
              docker compose logs --tail=100 frontend || true
              execute_rollback
            fi
            log "Host port 443 is LISTENING!"

            # Local HTTPS health check with Host header
            log "Verifying local HTTPS health via 127.0.0.1 with Host header..."
            LOCAL_HTTPS_OK=false
            for i in $(seq 1 5); do
              LOCAL_CODE=$(curl -vk -sS -o /dev/null -w "%{http_code}" --max-time 5 https://127.0.0.1/api/health -H "Host: edvedum.com" 2>/dev/null) || LOCAL_CODE="000"
              if [ "$LOCAL_CODE" -eq 200 ]; then
                log "Local HTTPS health check PASSED (HTTP 200 OK)!"
                LOCAL_HTTPS_OK=true
                break
              fi
              log "Attempt ${i}/5: Local HTTPS returned ${LOCAL_CODE}. Retrying in 2s..."
              sleep 2
            done

            if [ "$LOCAL_HTTPS_OK" = "false" ]; then
              log "CRITICAL ERROR: Local HTTPS health check failed! Frontend logs:"
              docker compose logs --tail=100 frontend || true
              execute_rollback
            fi

            # 8. Public HTTPS Health Verification
            log "Step 9/9: Verifying public health endpoints via https://edvedum.com..."

            PUB_HEALTH_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "$PUBLIC_HEALTH_URL") || HTTP_CODE="000"
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Public liveness check PASSED (HTTP 200 OK) on attempt ${i}/${MAX_RETRIES}!"
                PUB_HEALTH_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Public liveness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$PUB_HEALTH_OK" = "false" ]; then
              log "Public liveness check failed!"
              execute_rollback
            fi

            PUB_READY_OK=false
            for i in $(seq 1 $MAX_RETRIES); do
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "$PUBLIC_READY_URL") || HTTP_CODE="000"
              if [ "$HTTP_CODE" -eq 200 ]; then
                log "Public readiness check PASSED (HTTP 200 OK - DB Connected) on attempt ${i}/${MAX_RETRIES}!"
                PUB_READY_OK=true
                break
              else
                log "Attempt ${i}/${MAX_RETRIES}: Public readiness returned HTTP ${HTTP_CODE}. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              fi
            done

            if [ "$PUB_READY_OK" = "false" ]; then
              log "Public readiness check failed!"
              execute_rollback
            fi

            # Post-deployment cleanup
            log "Pruning dangling Docker build cache layers..."
            docker image prune -f --filter "until=24h" || true
            rm -rf "$BACKUP_DIR" || true

            log "=================================================="
            log " EDVEDUM Production Deployment SUCCESSFUL!"
            log " Active Commit: ${NEW_COMMIT}"
            log " Status: 100% Operational (Container & Public Health OK)"
            log "=================================================="
